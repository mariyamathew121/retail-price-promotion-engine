[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-price-promotion-engine"
version = "0.1.0"
description = "Traceable retail price and promotion decision engine"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.7",
    "mlxtend>=0.23",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyfixest>=0.60",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
validation = [
    "doubleml>=0.10.1",
]
dashboard = [
    "altair>=5.0",
    "streamlit>=1.40",
]

[project.scripts]
build-retail-data = "retail_engine.module1:main"
estimate-price-elasticity = "retail_engine.module2:main"
estimate-pooled-elasticity = "retail_engine.module2_pooled:main"
validate-module2 = "retail_engine.module2_validation:main"
estimate-promotion-uplift = "retail_engine.module3:main"
optimize-markdowns = "retail_engine.module4:main"
estimate-bundles = "retail_engine.module5:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
